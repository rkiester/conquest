      for (const p of alive) {
        const t = isHuman(p) ? inp[p].t : null;
        G.setCapital(g, p, t && g.state.territories[t] && g.state.territories[t].owner === p ? t : G.aiChooseCapital(g, p));
      }
      return mpDone(key, () => mpBegin("dep"));
    }
    if (kind === "dep") {
      const all = {};
      for (const p of alive) {
        const pl = isHuman(p) ? inp[p].pl : null;
        const ok = pl && typeof pl === "object" && Object.entries(pl).every(([t, n]) => g.state.territories[t] && g.state.territories[t].owner === p && Number.isInteger(n) && n >= 0)
          && Object.values(pl).reduce((a, b) => a + b, 0) === g.startPool[p];
        all[p] = ok ? pl : G.aiDeploy(g, p);
      }
      G.applyDeploy(g, all);
      if (g.objective === "capital") G.log(g, "Capitals revealed: " + Object.entries(g.capitals).map(([p, t]) => `${G.seat(g, p).name} – ${name(t)}`).join("; "), "phase");
      return mpDone(key, () => beginRound());
    }
    if (kind === "rf") {
      const pl = {}, infos = {};
      for (const p of alive) {
        if (isHuman(p)) {
          let armies = 0;
          for (const idx of Array.isArray(inp[p].tr) ? inp[p].tr : []) { try { armies += G.tradeSet(g, p, idx).armies; } catch (e) { /* invalid set ignored */ } }
          infos[p] = G.reinforcementInfo(g, p, armies);
          const want = inp[p].pl || {};
          const ok = typeof want === "object" && Object.values(want).every(n => Number.isInteger(n) && n >= 0) && !E.validatePlacements(g.state, g.mp, g.rules, p, want, infos[p].placeable).length;
          pl[p] = ok ? want : G.aiPlacements(g, p, infos[p].placeable, infos[p].pool);
        } else {
          const ca = G.aiTradeCards(g, p); infos[p] = G.reinforcementInfo(g, p, ca);
          pl[p] = G.aiPlacements(g, p, infos[p].placeable, infos[p].pool);
        }
      }
      G.applyReinforcement(g, pl, infos);
      return mpDone(key, () => beginOrders());
    }
    if (kind === "ord") {
      const orders = {};
      for (const p of alive) {
        const o = isHuman(p) && Array.isArray(inp[p].o) ? inp[p].o.map(a => Array.isArray(a) ? { source: a[0], target: a[1], armies: a[2], surge_to: a[3] || null, surge_armies: a[4] || null } : a) : null;
        orders[p] = o && !E.validateAttacks(g.state, g.mp, g.rules, p, o).length ? o : (isHuman(p) ? [] : G.aiAttacks(g, p));
      }
      const before = E.copyState(g.state);
      const report = G.resolveBattles(g, orders);
      return mpDone(key, () => { g.phase = "battle"; gameScreenKeep(); startPlayback(before, report); });
    }
    if (kind === "tac") {
      const moves = {};
      for (const p of G.alive(g)) {
        const m = isHuman(p) ? inp[p].m : null;
        moves[p] = isHuman(p) ? (m && Array.isArray(m.destinations) && !E.validateTactical(g.state, g.mp, g.rules, p, m).length ? m : null) : G.aiTactical(g, p);
      }
      G.applyTactical(g, moves);
      return mpDone(key, () => finishRound());
    }
  }
  function gameScreenKeep() { render(); }
  function mpDone(key, next) {
    const mp = ui.mp;
    const hash = NET.sha256(JSON.stringify({ s: g.state, c: g.cards, k: g.capitals })).slice(0, 12);
    mp.room.presence({ sy: { k: key, x: hash } });
    mp.lastSync = { k: key, x: hash };
    render();
    next();
  }

  function panelWaiting() {
    ui.refreshPanel = panelWaiting;
    panel(h("h3", {}, "Waiting for other players"), h("div", { id: "waitlist" }),
      h("p", { class: "hint" }, "The next phase starts when every player has submitted. Orders are sealed until then."));
    updateWaiting();
  }
  function updateWaiting(hostP) {
    const mp = ui.mp, el = $("#waitlist"); if (!el || !mp || !mp.phase) return;
    const key = mp.phase.key, byPeer = mp.byPeer || {};
    hostP = hostP || mp.room.peers().find(p => p.presence && p.presence.h);
    el.innerHTML = "";
    if (!hostP && !mp.host) el.append(h("p", { class: "warn" }, "The host has disconnected. The game can't continue until they return."));
    for (const s of humanSeats()) {
      const peer = mp.seatPeer[s], pres = byPeer[peer], here = !!pres || s === mp.mySeat;
      const done = s === mp.mySeat ? !!(mp.mine && mp.mine.key === key) : !!(pres && pres.sub && pres.sub.k === key);
      const taken = mp.takeovers.includes(s);
      el.append(h("div", { class: "prow" }, h("span", { class: "chip", style: `background:${ownerColor(s)}` }),
        h("span", { class: "pname" }, G.seat(g, s).name, s === mp.mySeat ? h("small", {}, " (you)") : null),
        h("span", { class: "pstat" }, taken ? "computer" : done ? "✓ submitted" : here ? "thinking…" : "⚠ disconnected"),
        mp.host && s !== mp.mySeat && !done && !taken ? h("button", { class: "btn tiny", title: "Hand this player's armies to a computer general", onclick: () => { mp.takeovers.push(s); mp.room.presence({ ai: mp.takeovers }); mpCheck(); updateWaiting(); } }, "Computer takes over") : null));
    }
    // desync check: everyone who has applied the same phase must have the same state
    if (mp.lastSync && !mp.warned) for (const p of Object.values(byPeer)) if (p.sy && p.sy.k === mp.lastSync.k && p.sy.x !== mp.lastSync.x) { mp.warned = true; G.log(g, "Warning: game states differ between players (out of sync).", "warn"); renderLog(); }
  }

  // continuation hooks
  ui.afterPlace = () => {
    for (const p of G.alive(g)) if (G.seat(g, p).type === "ai") ui.collected[p] = G.aiDeploy(g, p);
    G.applyDeploy(g, ui.collected);
    if (g.objective === "capital") G.log(g, "Capitals revealed: " + Object.entries(g.capitals).map(([p, t]) => `${G.seat(g, p).name} – ${name(t)}`).join("; "), "phase");
    autosave(); beginRound();
  };
  ui.afterReinforce = null;
  window.__conquest = { get game() { return g; }, ui };
  setupScreen();
})();
</script>
</body>
</html>
