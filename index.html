<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121820">
<meta name="mobile-web-app-capable" content="yes">
<title>Simultaneous Conquest</title>
<style>
:root{--bg:#0d1218;--panel:#151c25;--panel2:#1c2531;--line:#2a3646;--ink:#e8e2d4;--muted:#8b97a8;--gold:#d8b25a;--accent:#e2c27a;--danger:#d9583d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3,.brand{font-family:Georgia,"Palatino Linotype","Book Antiqua",serif;letter-spacing:.02em}
button{font:inherit}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(#c9a24b,#a7812f);color:#1a1408;border-color:#e0c072;font-weight:600}
.btn.ghost{background:transparent}.btn.small{padding:4px 9px;font-size:12.5px}.btn.tiny{padding:3px 8px;font-size:12px}.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.danger{border-color:#7a3426;color:#f0a08c}.btn.wide{width:100%;margin-top:10px}
.sel,.inp{background:#0f151d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.sel.small{padding:3px 6px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.muted{color:var(--muted)}.hint{color:var(--muted);font-size:12.5px}.warn{color:#f0b35a}.err{color:var(--danger);min-height:1.2em}.fine{color:var(--muted);font-size:11.5px}
.big{font-size:22px;font-family:Georgia,serif;margin:6px 0}.big small{font-size:13px;color:var(--muted)}
/* setup */
.setup{max-width:860px;margin:0 auto;padding:36px 20px}
.setup h1{font-size:40px;margin:0 0 6px;color:var(--accent);text-shadow:0 2px 0 #000}
.lede{color:#c8c0ae;max-width:640px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.card h3{margin:0 0 8px;font-size:16px;color:var(--accent)}
.seat{display:grid;grid-template-columns:14px 120px 1fr 1fr 90px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #223}
.seat .blurb{grid-column:3/6;color:var(--muted);font-size:12px;margin-top:-3px}.seat.off>*:not(:nth-child(2)):not(:first-child){opacity:.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12.5px}
.grid2 label.inline{flex-direction:row;align-items:center;color:var(--ink)}
/* game */
.game{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:linear-gradient(#18202b,#121820);border-bottom:1px solid var(--line)}
.brand{font-size:19px;color:var(--accent);white-space:nowrap}.status{flex:1;font-size:13.5px}.tools{display:flex;gap:6px;flex-wrap:wrap}
main{flex:1;display:flex;min-height:0}
.mapwrap{flex:1;position:relative;min-width:0;background:#173f57}
#map{width:100%;height:100%;display:block;user-select:none}
.terr-base{stroke:none}
.terr{stroke:#2a2418;stroke-width:.7;stroke-linejoin:round;cursor:pointer;transition:fill-opacity .2s}
.terr:hover{fill-opacity:.8;stroke:#fff6d8;stroke-width:1.4}
.terr.inert{fill:#8f8a7a;stroke:#5d594e;cursor:default}
.terr.sel{stroke:#fff3c4;stroke-width:2.4}
.terr.target{stroke:#fff;stroke-width:1.8;stroke-dasharray:5 3;animation:dash 1s linear infinite}
.terr.dim{fill-opacity:.45}
.grat line{stroke:rgba(200,225,240,.09);stroke-width:.6}
.wedge{pointer-events:none}.wedge.dash{stroke-dasharray:3 2}
.explosion{pointer-events:none}.ex-ball{animation:exball .75s ease-out forwards;transform-box:fill-box;transform-origin:center}
.ex-spark{stroke:#ffd36b;stroke-width:1.6;stroke-linecap:round;animation:exspark .6s ease-out forwards}
.ex-loss{font-size:12px;font-weight:800;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#a01d0b;stroke-width:3px;animation:exloss .9s ease-out forwards}
@keyframes exball{0%{transform:scale(.15);opacity:1}60%{opacity:.95}100%{transform:scale(1.25);opacity:0}}
@keyframes exspark{0%{opacity:1;stroke-dasharray:0 30}40%{stroke-dasharray:14 30}100%{opacity:0;stroke-dasharray:14 30;stroke-dashoffset:-12}}
@keyframes exloss{0%{transform:translateY(4px);opacity:0}20%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.tok{pointer-events:none}.tok.dead{opacity:.35}.num.small{font-size:10px}
.mdie{animation:roll .3s ease-out;transform-box:fill-box;transform-origin:center}.mdie-n{font-size:10.5px;font-weight:800;text-anchor:middle;pointer-events:none}
.blist{font-size:12px;color:var(--muted);padding-left:20px;margin:8px 0}.blist li.done{opacity:.45}.blist li.now{color:var(--accent);font-weight:600}
.small{font-size:12px}
.online{color:#7fe08a;font-weight:600}.code{font-family:ui-monospace,Consolas,monospace;font-size:28px;letter-spacing:.2em;color:var(--accent);background:#10161e;padding:2px 12px;border-radius:6px;border:1px solid var(--line)}
@keyframes dash{to{stroke-dashoffset:-18}}
.sea{stroke:#e8f1f7;stroke-width:1.1;stroke-dasharray:3 4;opacity:.7}
.lab{font-size:7.5px;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(20,16,8,.85);stroke-width:2.2px;font-weight:600;letter-spacing:.02em}
.badge{pointer-events:none}.num{font-size:10.5px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2px}
.plus{font-size:11px;font-weight:700;fill:#9ff09f;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:2.5px}
.cap{font-size:15px;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:2px}
.arrow{pointer-events:none;stroke-linecap:round}.arrow.dash{stroke-dasharray:7 5}
.alab{font-size:8.5px;fill:#fff;text-anchor:middle;font-weight:700;pointer-events:none}
.fx{fill:rgba(255,240,180,.22);stroke:#ffe08a;stroke-width:2;pointer-events:none;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{stroke-opacity:.4}to{stroke-opacity:1}}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;background:rgba(21,28,37,.9);color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.tip{position:absolute;left:10px;top:10px;background:rgba(13,18,24,.94);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;display:none;max-width:300px;pointer-events:none}
.die-dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;box-shadow:0 0 0 1px #000}
aside{width:340px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
#players{padding:8px 10px;border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:5px}.prow.me{background:#1f2a37}.prow.dead{opacity:.35;text-decoration:line-through}
.pname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pname small{color:var(--muted)}.pstat{font-size:12px;color:#c9c2b2;font-variant-numeric:tabular-nums}
.ally{font-size:11px;background:#2e5a3c;color:#c8f0d0;padding:0 5px;border-radius:4px}
.panel{padding:10px 14px;overflow:auto;flex:1}.panel h3{margin:4px 0 6px;color:var(--accent)}.panel h4{margin:10px 0 4px;color:#cfc6b2}
.breakdown{background:#10161e;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;margin:6px 0}
.cards{display:flex;gap:5px;flex-wrap:wrap}.cardc{display:flex;flex-direction:column;align-items:center;width:52px;padding:4px 2px;border-radius:5px;background:#e9e0c8;color:#2a2214;font-size:18px;line-height:1.1}
.cardc small{font-size:8.5px;text-align:center}.cardc.wild{background:#d8b25a}.cardc .ctype{opacity:.6;font-size:7.5px}
.cardc.pickable{cursor:pointer;transition:transform .12s}.cardc.pickable:hover{transform:translateY(-2px)}.cardc.picked{outline:3px solid var(--gold);transform:translateY(-4px);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.editor.surge{border-color:#5ab0d6}
.editor{background:#10161e;border:1px solid var(--gold);border-radius:8px;padding:8px 10px;margin:8px 0}.editor label{display:block;margin:6px 0}.editor input[type=range]{width:100%}
.orders .order,.order{display:flex;justify-content:space-between;align-items:center;background:#10161e;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:4px 0;font-size:12.5px}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}.x:hover{color:var(--danger)}
.dip{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed #223}.dip .row{grid-column:1/4;margin:2px 0}
.levels{font-size:12px;color:var(--muted);padding-left:18px}
.log{height:170px;overflow:auto;border-top:1px solid var(--line);padding:6px 10px;font-size:12px;background:#10151c}
.log .l{padding:1px 0;color:#c9c2b2}.log .r{color:#5d6b7d;font-variant-numeric:tabular-nums}.log .phase{color:var(--accent)}.log .take{color:#9fd6a8}.log .elim,.log .win{color:#ff9c7a;font-weight:600}.log .icom{color:#9cc3ff}.log .cards{color:#e6cf8f}.log .warn{color:#f0b35a}.log .muted{color:#77818f}
.battle{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,94%);background:rgba(14,19,26,.96);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.battle.hidden,.hidden{display:none!important}
.bhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:#2a3646}
.kind.border_clash{background:#5a3a1e}.kind.mass_invasion{background:#5a1e2a}.kind.spoils_of_war{background:#4a1e5a}.kind.surge{background:#1e4a5a}
.tag{font-size:11px;color:#f0c27a;border:1px solid #6a5530;border-radius:4px;padding:0 5px}
.bp{display:grid;grid-template-columns:14px 1fr 44px 34px;gap:8px;align-items:center;padding:3px 0}
.bpa{font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.bpa.gone{color:#6a6f78;text-decoration:line-through}
.die{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 1px #000;animation:roll .35s ease-out}
.die.ghost{background:#222a35;color:#556;box-shadow:none;animation:none}
@keyframes roll{from{transform:rotate(-90deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
.curtain{position:fixed;inset:0;background:rgba(5,8,12,.97);display:flex;align-items:center;justify-content:center;z-index:30}
.cbox{text-align:center}.cbox h2{font-size:34px;margin:0 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:760px;max-height:90vh;overflow:auto;position:relative}
.mbox h2{margin:0 0 10px;color:var(--accent)}.close{position:absolute;right:12px;top:8px;font-size:22px}
.rules li{margin:5px 0}.dt{border-collapse:collapse;font-size:12.5px}.dt td,.dt th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.chart{width:100%;background:#0f151d;border-radius:8px}.savebox{width:100%;height:140px;background:#0f151d;color:var(--muted);border:1px solid var(--line);border-radius:6px;font:11px ui-monospace,monospace}.faces{font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
@media (max-width:900px){main{flex-direction:column}aside{width:auto;height:46vh}.seat{grid-template-columns:14px 100px 1fr}.seat>select:nth-of-type(3){display:none}}

/* ---------- phones & tablets ---------- */
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#map{touch-action:none}
@media (pointer:coarse){.zoom button:not(:last-child){display:none}.zoom button{opacity:.8}}
.badge circle{pointer-events:auto;cursor:pointer}
.menu-btn,.sheet-handle{display:none}
.placed{margin:6px 0}
@media (max-width:760px),(max-height:520px){
  html,body{overscroll-behavior:none}
  .game{height:100dvh}
  header{position:relative;gap:6px;padding:5px 8px;padding-top:max(5px,env(safe-area-inset-top))}
  .brand{display:none}
  .status{font-size:12.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .status .muted{display:none}
  .menu-btn{display:block;font-size:18px;min-width:44px}
  .tools{display:none;position:absolute;right:6px;top:100%;z-index:60;flex-direction:column;align-items:stretch;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:10px;width:min(240px,80vw);box-shadow:0 12px 30px rgba(0,0,0,.6)}
  .tools.open{display:flex}
  .tools .btn,.tools .sel{width:100%;text-align:left}
  .btn{min-height:40px;padding:8px 14px}.btn.small{min-height:38px;font-size:14px}.btn.tiny{min-height:34px;padding:4px 12px;font-size:14px}
  .sel,.inp{font-size:16px;min-height:40px}
  .x{font-size:22px;padding:4px 8px}
  .zoom{right:8px;top:8px}.zoom button{width:42px;height:42px;font-size:20px}
  .tip{left:6px;top:6px;max-width:calc(100% - 64px);font-size:13px}
  .panel{padding:6px 12px 12px;font-size:14.5px}
  .editor input[type=range]{height:34px}
  .cardc{width:58px;font-size:20px}
  .order{font-size:14px;padding:6px 10px}
  .big{font-size:20px}
  .mbox{padding:14px 14px;max-height:92dvh;width:100%}
  .modal{padding:8px;align-items:flex-end}
  .dt{font-size:12px}
  .setup{padding:16px 12px 40px}.setup h1{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .seat{grid-template-columns:14px 1fr 1.3fr 82px;gap:6px}.seat>input{grid-column:3/5}.seat .blurb{grid-column:1/-1}
  .seat>select:nth-of-type(3){display:revert}
  .seat>*,.grid2>*{min-width:0}.seat .sel,.seat .inp,.grid2 .sel,.grid2 .inp{width:100%;min-width:0;text-overflow:ellipsis}
  .setup .row .inp{flex:1 1 140px;min-width:0}
  .code{font-size:22px}
  .curtain .cbox{padding:20px}
}
/* portrait phone: map on top, orders sheet underneath */
@media (max-width:760px) and (orientation:portrait),(max-width:560px){
  main{flex-direction:column}
  .mapwrap{flex:1 1 auto;min-height:0}
  aside{width:auto;height:46dvh;flex:none;border-left:none;border-top:1px solid var(--gold);border-radius:14px 14px 0 0;margin-top:-10px;position:relative;z-index:5;transition:height .2s;padding-bottom:env(safe-area-inset-bottom)}
  .sheet-handle{display:flex;justify-content:center;align-items:center;width:100%;height:22px;background:none;border:none;cursor:pointer;flex:none}
  .sheet-handle span{width:44px;height:5px;border-radius:3px;background:#56657a}
  .game.sheet-min aside{height:108px}
  .game.sheet-max aside{height:78dvh}
  #players{display:flex;gap:4px;overflow-x:auto;padding:2px 8px 6px;flex:none}
  #players .prow{flex:none;background:#10161e;padding:3px 7px;font-size:12px}#players .prow.me{background:#24303f}
  #players .pname{max-width:96px}#players .pstat{font-size:11px}
  .log{height:64px;flex:none;font-size:11.5px}
  .game.sheet-min .log,.game.sheet-min #players{display:none}
}
/* landscape phone: narrow side panel */
@media (max-height:520px) and (orientation:landscape){
  main{flex-direction:row}.mapwrap{flex:1;min-height:0}
  aside{width:min(320px,40vw);border-left:1px solid var(--line);height:auto;flex:none}
  .panel{font-size:13.5px}.btn{min-height:36px;padding:6px 12px}
  header{padding:2px 8px}.menu-btn{min-height:32px;padding:2px 12px}.log{display:none}
  #players{padding:4px 8px;font-size:12px}#players .prow{padding:1px 4px}
  .log{height:54px}
}
</style>
</head>

<script>window.SAMETIME_RULES={"schema_version":1,"title":"Risk II Same Time mode - structured rules database","note":"Rules marked MANUAL were checked against the original manual (pages cited). Everything else is still provisional. The engine reads 'value' for each 'param'.","status_legend":{"MANUAL":"Verified against the original Risk II PC manual (page cited).","CORROBORATED":"Stated by two or more independent secondary sources that agree.","SECONDARY":"Stated by a single secondary source (fan wiki, forum, FAQ, review).","BRIEF":"Stated in the project brief; not yet found in any external source.","PARTIAL":"A source constrains the rule but does not fully determine it; the engine value fills the gap.","CONFLICTING":"Sources disagree; the engine uses one of them and lists the alternatives.","UNSOURCED":"No source found. Engine value is a provisional placeholder that MUST be verified.","MISSING":"No source and no engine implementation yet; blocks a later deliverable.","ENGINE":"Engineering safeguard, not a game rule.","PLAYER":"Stated by the project owner from first-hand play of the original game; not in the manual."},"sources":{"S1":{"title":"Steam forum: '@Devs: Add Same-Time Risk!!' (RISK: Global Domination discussions)","url":"https://steamcommunity.com/app/1128810/discussions/0/2993171056498804320/","kind":"fan forum post written from memory/experience"},"S2":{"title":"Wikipedia: Risk II","url":"https://en.wikipedia.org/wiki/Risk_II","kind":"encyclopedia (mechanics section partly mislabelled 'Real Time Risk')"},"S3":{"title":"GameSpot: Risk II Review","url":"https://www.gamespot.com/reviews/risk-ii-review/1900-2565951/","kind":"contemporary review (2000)"},"S4":{"title":"Risk Wiki (Fandom): Risk II","url":"https://risk.fandom.com/wiki/Risk_II","kind":"fan wiki"},"S5":{"title":"Axis & Allies forum: 'Same Time Axis and Allies'","url":"https://www.axisandallies.org/forums/topic/25173/same-time-axis-and-allies","kind":"fan forum post describing Risk II rules"},"S6":{"title":"GameFAQs: Risk II General FAQ v1.1 by RoninDarky","url":"https://gamefaqs.gamespot.com/pc/250549-risk-ii/faqs/29867","kind":"player FAQ (only search snippets retrieved; full text not fetched)"},"S7":{"title":"Codex Gamicus: Risk II","url":"https://gamicus.fandom.com/wiki/Risk_II","kind":"fan wiki"},"S8":{"title":"Gameindustry.com: 'Risk II Globally Dominates' review","url":"https://www.gameindustry.com/reviews/game-review/risk-ii-globally-dominates/","kind":"contemporary review (2000)"},"S9":{"title":"eBay product description: Risk II (PC, 2000)","url":"https://www.ebay.com/p/6480177","kind":"publisher box/product copy"},"M":{"title":"Risk II PC manual (Hasbro Interactive / MicroProse, 2000), 64-page scan","url":"https://www.scribd.com/document/691814004/Risk-II-Manual-Pc","kind":"original manual (primary source); page numbers cited per rule"},"S10":{"title":"Conquer Club forum: 'Classic Map with added options' (2007), list of Risk II's six added territories","url":"https://www.conquerclub.com/forum/viewtopic.php?p=995632","kind":"player forum post"},"U1":{"title":"Original Risk II Same Time screenshot supplied by the user","url":"","kind":"screenshot of the original game"},"U2":{"title":"Project owner's account of original Risk II gameplay (chat, 2026-11-18)","url":"","kind":"first-hand player testimony"}},"rules":[{"id":"R-PH-001","phase":"round","title":"Round phase order","statement":"Each Same Time round is: I-COM (diplomacy), Reinforcement, Battle, Tactical Move.","status":"MANUAL","sources":["M","S1","S6"],"param":"round_phases","value":["diplomacy","reinforcement","battle","tactical_move"],"manual_pages":[36,39],"notes":"Manual p36: every round is Diplomacy, Reinforcement, Battles, Tactical Moves."},{"id":"R-BT-001","phase":"battle","title":"Battle sub-phase order","statement":"Battles resolve in the order Border Clashes, Mass Invasions, Invasions, Spoils of War, Surge Attacks.","status":"MANUAL","sources":["M","S1","S2","S5"],"notes":"Manual p41 priority list: border clashes, mass invasions, invasions, spoils of war, surge attacks. Owner confirms surges resolve after all other attack phases.","param":"battle_subphase_order","value":["border_clash","mass_invasion","invasion","spoils_of_war","surge"],"manual_pages":[41]},{"id":"R-BT-002","phase":"battle","title":"Order of battles within a sub-phase","statement":"Within one sub-phase, battles are resolved in ascending territory-id order.","status":"UNSOURCED","sources":[],"notes":"Order matters for the RNG stream and for chained effects (e.g. a border-clash winner rear-assaulting). The original's order is unknown.","param":"intra_subphase_order","value":"territory_id_ascending","alternatives":["order_submitted","random_seeded","player_order"]},{"id":"R-DC-001","phase":"dice","title":"Battle die face distributions","statement":"Five weighted 12-sided dice with values 1-6. Manual gives each die's face total; the per-face counts are not in the manual.","status":"PARTIAL","sources":["M","S1","S3","S8"],"notes":"Manual totals: white 31 (>=4 faces of 1), yellow 35 (25% of faces are 2), orange 42, red 49, black 54. S1's tables match white/orange/red exactly. S1's yellow (four 2s) and black (total 53) contradict the manual, so those two rows were changed to the smallest edit that satisfies the manual: yellow now has three 2s, black totals 54. Exact yellow/black faces remain unverified.","param":"dice_faces","value":{"white":[4,3,2,1,1,1],"yellow":[3,3,2,1,2,1],"orange":[1,2,3,3,2,1],"red":[1,1,2,2,4,2],"black":[1,1,1,1,4,4]},"manual_pages":[42,43,44],"face_totals":{"white":31,"yellow":35,"orange":42,"red":49,"black":54}},{"id":"R-DC-002","phase":"dice","title":"Attacking army size -> die colour","statement":"An attacking army's die colour is set by its size.","status":"MANUAL","sources":["M","S1","S2","S7"],"notes":"Manual table p45: attack white 1-3, yellow 4-7, orange 8-12, red 13-18, black 19+. S2/S7's '30+' was wrong.","param":"attack_thresholds","value":[{"color":"white","min":1,"max":3},{"color":"yellow","min":4,"max":7},{"color":"orange","min":8,"max":12},{"color":"red","min":13,"max":18},{"color":"black","min":19,"max":null}],"manual_pages":[42,43,44,45]},{"id":"R-DC-003","phase":"dice","title":"Defending army size -> die colour","statement":"A defending army's die colour is set by its size, with higher thresholds than attack.","status":"MANUAL","sources":["M","S1"],"notes":"Manual p44-45: defending army never uses black (N/A); red at 21+.","param":"defend_thresholds","value":[{"color":"white","min":1,"max":6},{"color":"yellow","min":7,"max":12},{"color":"orange","min":13,"max":20},{"color":"red","min":21,"max":null}],"manual_pages":[42,43,44,45]},{"id":"R-DC-004","phase":"dice","title":"Colour re-evaluated as army shrinks","statement":"Die colour is chosen from the army's current size before every roll.","status":"MANUAL","sources":["M","S1"],"param":"recolor_each_roll","value":true,"manual_pages":[42,45],"notes":"Manual p42: appropriate die assigned at the start of each dice roll; p45 'Change of Dice During Battle'."},{"id":"R-DC-005","phase":"dice","title":"One die per army per roll","statement":"Each army in a battle rolls one die per exchange; a defender facing several attackers rolls once and that roll is compared with every attacker's roll.","status":"MANUAL","sources":["M","S1","S2","S7"],"notes":"Manual p44: each battling army rolls one 12-sided die; the defender's single roll is compared with each attacking army's die.","param":"die_per_exchange","value":"one_per_combatant","alternatives":["one_per_pair"],"manual_pages":[44]},{"id":"R-DC-006","phase":"dice","title":"Casualties per comparison","statement":"The loser of each comparison loses N armies, where N is the rank of the lowest-ranked die rolled in that exchange of the battle (white 1, yellow 2, orange 3, red 4, black 5), capped at the armies it has.","status":"MANUAL","sources":["M","S3","S8"],"notes":"Manual p44-45: casualties per comparison equal the rank (white 1 ... black 5) of the lowest-ranked die involved in the battle. Example: two orange vs red defender -> 3 per comparison; three black vs white -> 1. p55 confirms: all-black battle -> 5 casualties per comparison.","param":"casualty_mode","value":"lowest_die_rank_in_battle","manual_pages":[44,45,55],"alternatives":["lowest_die_rank_in_comparison","one"]},{"id":"R-DC-007","phase":"dice","title":"Ties between attacker and defender","statement":"On equal rolls the attacker wins the comparison.","status":"PLAYER","sources":["U2","M","S3"],"notes":"CONFLICT: the manual's strategy chapter (p55) says 'a defender wins on a draw', and its Classic dice section (p39) also gives ties to the defender. The project owner, from play of the original, says ties go to the attacker, which matches GameSpot's review (S3: 'the defender no longer wins a tie in same-time Risk'). Engine follows the owner; set value to 'defender_wins' to follow the manual.","param":"tie_rule_attack_vs_defend","value":"attacker_wins","alternatives":["defender_wins","no_casualties","both_lose"],"manual_pages":[55]},{"id":"R-DC-008","phase":"dice","title":"Ties between two attacking armies","statement":"In border clashes and Spoils of War, equal rolls cause no casualties.","status":"UNSOURCED","sources":[],"param":"tie_rule_symmetric","value":"no_casualties","alternatives":["both_lose"],"notes":"Manual does not say how ties resolve when two attacking armies meet (border clash, spoils). Engine re-rolls."},{"id":"R-CB-001","phase":"combat","title":"Fight to elimination","statement":"A battle continues until one side has no armies left; attackers cannot retreat.","status":"PARTIAL","sources":["M","S6"],"notes":"Manual p39 (classic) says a defender cannot retreat and must fight until won or lost; Same Time gives no retreat option either. Attackers fighting to elimination in Same Time is implied, not stated.","param":"fight_to_elimination","value":true,"manual_pages":[39]},{"id":"R-CB-002","phase":"combat","title":"Casualty timing within an exchange","statement":"All comparisons in one exchange are decided from the same rolls and casualties are applied together afterwards.","status":"UNSOURCED","sources":[],"param":"casualty_timing","value":"simultaneous","alternatives":["sequential_by_attacker"]},{"id":"R-CB-003","phase":"combat","title":"Exchange limit","statement":"A battle aborts with an error after this many exchanges (protects against non-terminating tie rules).","status":"ENGINE","sources":[],"param":"max_exchanges","value":100000},{"id":"R-BC-001","phase":"border_clash","title":"Border clash trigger","statement":"When territory A orders an attack on B and B (another player) orders an attack on A, the two attacking armies fight each other first.","status":"MANUAL","sources":["M","S1","S2"],"param":null,"value":null,"manual_pages":[41],"notes":"Manual p41: head-to-head battles where both armies charged towards each other's territory."},{"id":"R-BC-002","phase":"border_clash","title":"Border clash dice role","statement":"Both armies in a border clash use attack thresholds.","status":"UNSOURCED","sources":[],"param":"border_clash_role","value":"attack"},{"id":"R-BC-003","phase":"border_clash","title":"Border clash winner continues","statement":"The surviving army proceeds with its remaining armies to attack its original target in the later sub-phases.","status":"PARTIAL","sources":["S6"],"notes":"S6 snippet reads 'attacking armies will battle each other and the winning army will ...' (truncated). Whether the winner continues, returns home, or stops at the border must be verified.","param":"border_clash_winner","value":"continues_to_target","alternatives":["returns_to_source","stops"]},{"id":"R-MI-001","phase":"mass_invasion","title":"Mass invasion","statement":"Two or more armies (from one or several players) attacking the same territory fight the defender together.","status":"MANUAL","sources":["M","S1","S2","S4","S7"],"param":null,"value":null,"manual_pages":[10,41,42],"notes":"Manual p41: multiple army attacks against a single army defending a single territory. p10/p42: up to seven armies can fight over one territory."},{"id":"R-MI-002","phase":"mass_invasion","title":"Each attacking army rolls its own die","statement":"In a mass invasion each attacking army rolls its own die, coloured by its own size.","status":"MANUAL","sources":["M","S1","S7"],"param":null,"value":null,"manual_pages":[42,44]},{"id":"R-MI-003","phase":"mass_invasion","title":"Mass invasion pairing","statement":"Each attacking army's roll is compared with the defender's roll; the defender can lose several armies in one exchange.","status":"MANUAL","sources":["M"],"notes":"Manual p44: individual comparisons between the defending army's die and each attacking army's die.","param":"mass_invasion_pairing","value":"defender_vs_each_attacker","manual_pages":[44]},{"id":"R-MI-006","phase":"mass_invasion","title":"Mass attackers protect each other","statement":"In a mass invasion the attackers lose armies only if the defender's roll beats every attacker's roll in that exchange; then each attacker loses the casualty amount. If any attacker wins its comparison, no attacker loses anything, and the defender loses the casualty amount once for every attacker that beat it.","status":"PLAYER","sources":["U2"],"param":"mass_invasion_mutual_defense","value":true,"alternatives":[false],"notes":"Owner (2026-11-19): 'if even one of the attackers wins, none of the attackers take damage ... in order for the mass attackers to lose any troops, the defending territory has to roll higher than all of them.' Not stated in the manual (p44 only says comparisons are made between the defender's die and each attacker's die). Owner confirmed (2026-11-19) that it covers every army attacking the territory, including different players' armies that happen to attack it together."},{"id":"R-MI-004","phase":"mass_invasion","title":"Single-player capture","statement":"If every surviving attacker belongs to one player, that player takes the territory with all surviving armies.","status":"UNSOURCED","sources":[],"param":null,"value":null},{"id":"R-MI-005","phase":"invasion","title":"Undefended target","statement":"If the target has zero armies when its battle starts, attackers take it without a fight (only reachable when minimum garrison is 0).","status":"UNSOURCED","sources":[],"param":null,"value":null},{"id":"R-SW-001","phase":"spoils_of_war","title":"Spoils of War trigger","statement":"If armies of two or more players defeat a defender together, the survivors fight for the territory after all invasions are resolved.","status":"MANUAL","sources":["M","S1","S2","S4","S5"],"param":null,"value":null,"manual_pages":[41],"notes":"Manual p41: spoils of war is a fight between different players after a joint mass invasion; resolved 4th."},{"id":"R-SW-002","phase":"spoils_of_war","title":"Spoils dice role","statement":"All Spoils of War participants roll as attackers.","status":"SECONDARY","sources":["S5","U2"],"param":"spoils_role","value":"attack","notes":"Owner confirmed (2026-11-19): after the defender falls, co-invading players fight for the territory on equal footing."},{"id":"R-SW-003","phase":"spoils_of_war","title":"Spoils pairing","statement":"Every army compares its roll with every army of a different player; mass-invasion rules apply to a player's multiple armies.","status":"PARTIAL","sources":["S5","U2"],"notes":"S5: 'all rules that apply for mass invasions ... apply here'. Pairing for 3+ players is not described. Owner confirmed (2026-11-19): after the defender falls, co-invading players fight for the territory on equal footing.","param":"spoils_pairing","value":"all_cross_player_pairs"},{"id":"R-SW-004","phase":"spoils_of_war","title":"Contested territory between invasion and spoils","statement":"After the defender falls, the territory has no owner and no armies until Spoils of War resolves.","status":"UNSOURCED","sources":[],"param":null,"value":null},{"id":"R-SW-005","phase":"spoils_of_war","title":"Mutual annihilation in spoils","statement":"If all spoils participants are eliminated in the same exchange, the territory becomes neutral with 0 armies.","status":"UNSOURCED","sources":[],"notes":"Only possible with 3+ players. Neutral handling elsewhere is also unspecified.","param":"spoils_all_dead","value":"neutral_empty","alternatives":["revert_to_defender_1"]},{"id":"R-SG-001","phase":"surge","title":"One surge per player per round","statement":"Each player may designate one surge attack per round.","status":"PLAYER","sources":["M","U2","S1","S2","S4","S6"],"param":"max_surges_per_player","value":1,"manual_pages":[41,55],"notes":"Manual p41 describes the surge attack; one per player per round from secondary sources (S1, S2, S4, S6). p55: 'Don't forget your surge.'"},{"id":"R-SG-002","phase":"surge","title":"Surge requires success","statement":"The surge happens only if the first attack captured its target.","status":"MANUAL","sources":["M","S1"],"param":null,"value":null,"manual_pages":[41],"notes":"Manual p41: if successful in that battle, the army moves on to challenge a second hostile territory."},{"id":"R-SG-003","phase":"surge","title":"Surge army count","statement":"The surge is chosen per attacked territory: the player picks one territory they are attacking (from any number of their territories), a hostile territory beside it, and how many armies surge (1 up to all their armies attacking it minus the one that must stay). If the territory is taken, that many armies - capped by the armies actually there minus one - move on.","status":"PLAYER","sources":["M","U2"],"notes":"Owner (2026-11-18, second correction): 'you can click on that territory and move all of the attacking troops, assuming they take no losses ... one troop would need to remain in the territory being attacked ... You can only select one territory per round to surge from.' Manual p41: 'the army then moves on to challenge a second hostile territory.'","param":"surge_count_mode","value":"designated_capped","alternatives":["surviving_army","all_but_garrison"]},{"id":"R-SG-004","phase":"surge","title":"Surge target","statement":"The surge target must be adjacent to the first target and not owned by the surging player when orders are given.","status":"MANUAL","sources":["M","S1"],"param":null,"value":null,"manual_pages":[41],"notes":"Manual p41: the second territory must be hostile. p55: two buffer territories stop a surge, i.e. a surge reaches exactly one territory beyond the first."},{"id":"R-SG-005","phase":"surge","title":"Surge into now-friendly territory","statement":"If the surge target belongs to the surging player when surges resolve, the surge is cancelled.","status":"UNSOURCED","sources":[],"param":"surge_into_friendly","value":"cancel","alternatives":["move_in"]},{"id":"R-SG-006","phase":"surge","title":"Simultaneous surges into one territory","statement":"Surges from several players into one territory fight the defender as a mass invasion, followed at once by Spoils of War if needed.","status":"UNSOURCED","sources":[],"param":null,"value":null},{"id":"R-RA-001","phase":"rear_assault","title":"Rear assault = invasion through the back door","statement":"A territory whose armies were sent elsewhere is defended only by the armies left behind; the attack resolves as an ordinary invasion.","status":"MANUAL","sources":["M"],"notes":"Manual p41 defines 'Invasions' as a single army attacking into the 'back door' of a territory whose occupying army is stationary or attacking away. There is no separate 'rear assault' rule; the engine tags such invasions 'rear_assault' for display only.","param":"rear_assault_mode","value":"garrison_only","manual_pages":[41]},{"id":"R-OR-001","phase":"orders","title":"Multiple attacks","statement":"A player may order any number of attacks from any number of territories.","status":"MANUAL","sources":["M","S1","S7"],"param":null,"value":null,"manual_pages":[41,37],"notes":"Manual p41: each player chooses territories to attack and how many armies; p37 (classic) no limit on number of attacks."},{"id":"R-OR-002","phase":"orders","title":"Adjacent targets only","statement":"An attack moves through only one territory (target must be adjacent to the source), apart from the surge.","status":"MANUAL","sources":["M","S2","S7"],"param":null,"value":null,"manual_pages":[37,41],"notes":"Manual p37/41: targets must border the source or be linked by a dotted line."},{"id":"R-OR-003","phase":"orders","title":"Minimum garrison","statement":"At least this many armies must stay in every source territory.","status":"PARTIAL","sources":["M"],"notes":"Manual p37 (classic): at least two battalions needed to attack because one must remain. Assumed identical in Same Time.","param":"min_garrison","value":1,"manual_pages":[37]},{"id":"R-OR-004","phase":"orders","title":"Committed armies do not defend","statement":"Armies assigned to an attack are not available to defend their source territory.","status":"BRIEF","sources":[],"param":null,"value":null},{"id":"R-OR-005","phase":"orders","title":"Hidden simultaneous orders","statement":"Orders are committed before any are revealed (engine provides a salted SHA-256 commitment).","status":"MANUAL","sources":["M"],"param":null,"value":null,"manual_pages":[34,41],"notes":"Manual p34: in Same Time each player deploys secretly in one go; p41: battle plans chosen simultaneously."},{"id":"R-OR-006","phase":"orders","title":"One attack per source-target pair","statement":"A player may give at most one attack order from a given source to a given target.","status":"ENGINE","sources":[],"param":null,"value":null},{"id":"R-TM-001","phase":"tactical_move","title":"One tactical move per round","statement":"Each player may make one tactical move per round.","status":"PARTIAL","sources":["M","S6"],"param":"tactical_moves_per_player","value":1,"manual_pages":[41],"notes":"Manual p41: players are given the option of a tactical move."},{"id":"R-TM-002","phase":"tactical_move","title":"Tactical move shape","statement":"A tactical move takes armies from one territory and may split them among several adjacent friendly territories.","status":"MANUAL","sources":["M","S1","S6"],"param":"tactical_move_reach","value":"adjacent","alternatives":["connected_path"],"manual_pages":[41],"notes":"Manual p41: transfer battalions from one territory to any or all friendly neighbouring territories (border or red dotted line)."},{"id":"R-TM-003","phase":"tactical_move","title":"Tactical moves are simultaneous","statement":"All players' tactical moves are validated against the post-battle state and applied together.","status":"UNSOURCED","sources":[],"param":null,"value":null},{"id":"R-TM-004","phase":"tactical_move","title":"Tactical move limit per destination","statement":"A territory can receive at most 1 + (number of adjacent territories the player owns) armies in the tactical move - the same limit as restricted reinforcement.","status":"PLAYER","sources":["U2"],"param":"tactical_destination_cap","value":"placement_cap","alternatives":["none"],"notes":"Owner: 'you were only allowed to move a certain amount of troops into a given territory ... the same number as what you can reinforce in that territory.'"},{"id":"R-RF-001","phase":"reinforcement","title":"Base reinforcements","statement":"Base = floor((territories owned + territories in largest connected group) / 3).","status":"MANUAL","sources":["M","S1"],"notes":"Manual p40: (territories owned + largest connected empire) / 3. p50: if two groups tie, both shown; size is what counts. Rounding not stated (engine floors).","param":"reinforcement_formula","value":"territories_plus_largest_group_div_3","manual_pages":[40,50]},{"id":"R-RF-002","phase":"reinforcement","title":"Minimum reinforcements","statement":"No minimum: base reinforcements are exactly floor((territories + largest group)/3).","status":"PARTIAL","sources":["M"],"notes":"Manual p40 gives the formula with no minimum (Classic p37 also states one-third with no minimum). The board game's minimum of 3 is available as an alternative.","param":"min_reinforcements","value":0,"alternatives":[3],"manual_pages":[40]},{"id":"R-RF-003","phase":"reinforcement","title":"Continent bonuses","statement":"Same Time continent bonuses: Australia 4, South America 4, Africa 5, Europe 6, North America 6, Asia 8 (Classic: 2,2,3,5,5,7).","status":"MANUAL","sources":["M"],"notes":"Manual p40 (Same Time) and p37 (Classic). Values are editable in the original's Options menu.","param":"continent_bonuses","value":{"australia":4,"south_america":4,"africa":5,"europe":6,"north_america":6,"asia":8},"manual_pages":[37,40]},{"id":"R-RF-004","phase":"reinforcement","title":"Placement restriction","statement":"A territory may receive at most 1 + (number of adjacent territories the player owns) reinforcements per round.","status":"MANUAL","sources":["M","S1"],"param":"placement_restriction","value":"one_plus_owned_neighbours","manual_pages":[41,54],"notes":"Manual p41: restricted reinforcement - a territory may receive at most (1 + number of connected owned territories). Example: China with India, Siam, Mongolia owned -> 4. p54 example: South Africa 4, Brazil 4, North Africa 4.","alternatives":["none"]},{"id":"R-RF-005","phase":"reinforcement","title":"Card bonuses","statement":"Fixed set values (manual p36 'Set Value'): 3 infantry = 4, 3 cavalry = 6, 3 artillery = 8, one of each = 10; a wild card completes any set. One card per round if the player conquered at least one territory; +2 armies on an owned territory shown on a traded card; must trade with five cards.","status":"MANUAL","sources":["M"],"param":"card_trade_mode","value":"set_value","manual_pages":[34,35,36],"alternatives":[],"notes":"The manual also lists Ascending variants; the project owner chose fixed set values only. Symbol per territory and number of wild cards are not in the manual (engine: classic deck, symbols in rotation, 2 wild)."},{"id":"R-MP-001","phase":"map","title":"42-territory map","statement":"Territory names and adjacencies follow the classic Risk board.","status":"UNSOURCED","sources":[],"notes":"Classic board names and links. The visual map uses real coastlines (Natural Earth, public domain); its borders are cosmetic and do not define adjacency.","param":null,"value":null},{"id":"R-MP-002","phase":"map","title":"Six optional extra territories","statement":"Optional 48-territory map adds Oikiqtaluk (NWT, Greenland), Svalbard (Greenland, Scandinavia), Hawaii (Western US, Japan), Falkland Islands (Argentina, South Africa), New Zealand (Eastern Australia, Argentina) and Philippines (Japan, Indonesia).","status":"PARTIAL","sources":["M","S10","U1"],"param":null,"value":null,"notes":"Names and links from S10; the user's screenshot of the original shows Svalbard, Hawaii, Falkland Islands, Philippines, New Zealand and Oikiqtaluk on the map. Manual p54 implies the Falklands has exactly one South American neighbour (it accepts 2 reinforcements), consistent with S10. Continents per S10 (Oikiqtaluk assumed North America). Whether classic links that cross the new islands remain is unverified; the engine keeps them.","manual_pages":[48,54]},{"id":"R-DP-001","phase":"diplomacy","title":"I-COM diplomacy","statement":"I-Com: only when one human plays against computer players. Icons: threat (no reply needed); Level 1 alliance (do not attack each other's wholly-owned continents or largest connected empire); Level 2 (do not attack each other's territories except one insignificant attack for a card); Level 3 (no attacks of any kind). Accepted proposals last for the current round only. AI checks adherence to last round's agreements and adjusts its attitude.","status":"MANUAL","sources":["M"],"param":null,"value":null,"manual_pages":[50,51],"notes":"Alliances are not enforced by the rules; breaking one only changes AI attitude."},{"id":"R-VC-001","phase":"victory","title":"World domination thresholds","statement":"World Domination: 100% = every territory. 60%: 25 of 42 or 33 of 48. 80%: 29 of 42 or 38 of 48.","status":"MANUAL","sources":["M"],"param":"domination_targets","value":{"100":{"42":42,"48":48},"80":{"42":29,"48":38},"60":{"42":25,"48":33}},"alternatives":[60,80],"manual_pages":[21,22]},{"id":"R-VC-002","phase":"victory","title":"Capital and Mission objectives","statement":"Capital: each player secretly picks a capital; win by capturing 2 (3-4 players), 3 (5-6) or 4 (7-8) enemy capitals while holding your own. Same Time missions 1-6 (destroy a player; destroy holder of a territory; one continent + presence in all others; two named continents; one of Asia/N. America/Europe + 8 connected outside it; a continent + three named territories). Mission victory cannot be claimed before the end of round 3.","status":"MANUAL","sources":["M"],"param":null,"value":null,"manual_pages":[26,27,28,29],"notes":"Capital target for 2 players is not stated (engine: 1)."},{"id":"R-ST-001","phase":"setup","title":"Starting armies","statement":"Starting armies per player: 2p 40, 3p 35, 4p 30, 5p 25, 6p 20, 7p 20, 8p 20; placed secretly in one go after allocation.","status":"UNSOURCED","sources":["M"],"manual_pages":[30,34],"notes":"Manual p34 confirms Same Time players deploy all starting troops secretly in one go, but gives no counts. Counts are the classic board's; 7-8 player counts invented.","param":"starting_armies","value":{"2":40,"3":35,"4":30,"5":25,"6":20,"7":20,"8":20}},{"id":"R-ST-002","phase":"setup","title":"Territory allocation","statement":"Random allocation divides territories as evenly as possible (Territory Grab and Election also exist).","status":"MANUAL","sources":["M"],"manual_pages":[29,30,31],"param":null,"value":null},{"id":"R-VC-003","phase":"victory","title":"Domination option","statement":"Game option choosing the World Domination level (60, 80 or 100 percent).","status":"MANUAL","sources":["M"],"manual_pages":[21,22],"param":"domination_percent","value":100,"alternatives":[60,80]},{"id":"R-RF-006","phase":"reinforcement","title":"Reinforcements beyond placement capacity","statement":"If restricted placement caps (R-RF-004) cannot hold all reinforcements, the excess is forfeited; the player must place min(reinforcements, total capacity).","status":"UNSOURCED","sources":[],"param":"excess_reinforcements","value":"forfeit"}]};

    const territories = {};

    const state = { map_id: mp.id, players: ids, territories, round: 1, eliminated: [] };
    // Cards (manual p34): 42 territory cards + 2 wild. Symbol per territory UNSOURCED (rotation).
    const deck = mp.ids.map((t, i) => ({ territory: t, type: CARD_TYPES[i % 3] })).concat([{ territory: null, type: "wild" }, { territory: null, type: "wild" }]);
    shuffle(deck, setupRng);
    const start = rules.value("starting_armies")[String(ids.length)] || 20;
    const g = {
      version: 1, seed, cfg, rules, rulesDb, mapData, mp, seats, state,
      objective: cfg.objective || "domination",
      cards: { deck, discard: [], hands: Object.fromEntries(ids.map(p => [p, []])), setsTraded: 0 },
      capitals: {}, agreements: [], attitude: {}, grudges: {},
      startPool: Object.fromEntries(ids.map(p => [p, start - E.ownedBy(state, p).length])),
      phase: "deploy", history: [], log: [], lastReport: null, winner: null,
      aiRng: new E.PCG32(seed, 7),
    };
    for (const s of seats) if (s.type === "ai") { g.attitude[s.id] = {}; g.grudges[s.id] = {}; for (const o of ids) if (o !== s.id) g.attitude[s.id][o] = 0; }
    snapshot(g);
    return g;
  }
  const seat = (g, p) => g.seats.find(s => s.id === p);
  const alive = g => g.state.players.filter(p => !g.state.eliminated.includes(p));
  const humans = g => alive(g).filter(p => seat(g, p).type === "human");
  function log(g, text, cls) { g.log.push({ round: g.state.round, text, cls: cls || "" }); }
  function snapshot(g) {
    const row = { round: g.state.round, players: {} };
    for (const p of g.state.players) row.players[p] = { territories: E.ownedBy(g.state, p).length, armies: E.totalArmies(g.state, p) };
    g.history.push(row);
  }

  // ------------------------------------------------------------------ capitals (manual p29)
  function capitalTarget(g) { const n = g.state.players.length; return n <= 2 ? 1 /* UNSOURCED */ : n <= 4 ? 2 : n <= 6 ? 3 : 4; }
  function aiChooseCapital(g, p) {
    let best = null, bs = -1e9;
    for (const t of E.ownedBy(g.state, p)) {
      const adj = [...g.mp.t[t].adj];
      const s = adj.filter(n => g.state.territories[n].owner === p).length * 2 - adj.length;
      if (s > bs) { bs = s; best = t; }
    }
    return best;
  }
  function setCapital(g, p, t) { g.capitals[p] = t; }

  // ------------------------------------------------------------------ cards (manual p34-36)
  function setValue(g, cards) {
    const mode = g.rules.value("card_trade_mode"), k = g.cards.setsTraded;
    if (mode === "ascending") { const v = [4, 6, 8, 10, 12, 15]; return k < 6 ? v[k] : 15 + 5 * (k - 5); }
    if (mode === "ascending_by_one") return 4 + k;
    // fixed set values (manual p36); a wild card completes whichever set is worth most
    const V = { infantry: 4, cavalry: 6, artillery: 8 };
    const types = cards.map(c => c.type).filter(t => t !== "wild"), uniq = new Set(types);
    const opts = [];
    if (uniq.size === types.length) opts.push(10);
    if (uniq.size <= 1) opts.push(...(types.length ? [V[types[0]]] : Object.values(V)));
    return Math.max(...opts);
  }
  function isSet(cards) {
    if (cards.length !== 3) return false;
    const t = cards.map(c => c.type).filter(x => x !== "wild");
    const u = new Set(t);
    return u.size <= 1 || u.size === t.length;
  }
  function findSets(hand) {
    const out = [];
    for (let i = 0; i < hand.length; i++) for (let j = i + 1; j < hand.length; j++) for (let k = j + 1; k < hand.length; k++)
      if (isSet([hand[i], hand[j], hand[k]])) out.push([i, j, k]);
    return out;
  }
  /** Trade a set; returns {armies, bonus:[territories +2]} and updates hands. */
  function tradeSet(g, p, idx) {
    const hand = g.cards.hands[p], cards = idx.map(i => hand[i]);
    if (!isSet(cards)) throw new Error("not a valid set");
    const armies = setValue(g, cards);
    g.cards.setsTraded++;
    g.cards.hands[p] = hand.filter((_, i) => !idx.includes(i));
    g.cards.discard.push(...cards);
    const bonus = cards.filter(c => c.territory && g.state.territories[c.territory].owner === p).map(c => c.territory);
    for (const t of bonus) g.state.territories[t].armies += 2; // placed immediately (manual p35)
    log(g, `${seat(g, p).name} trades cards for ${armies} armies${bonus.length ? " (+2 on " + bonus.map(t => g.mp.t[t].name).join(", ") + ")" : ""}`, "cards");
    return { armies, bonus };
  }
  function drawCard(g, p, rng) {
    if (!g.cards.deck.length) { g.cards.deck = shuffle(g.cards.discard, rng); g.cards.discard = []; }
    if (g.cards.deck.length) g.cards.hands[p].push(g.cards.deck.pop());
  }

  // ------------------------------------------------------------------ reinforcement
  /** Pool for the round: base + continents + traded card armies (cards are added by the caller). */
  function reinforcementInfo(g, p, cardArmies) {
    const r = E.reinforcements(g.state, g.mp, g.rules, p);
    const pool = r.total + (cardArmies || 0);
    const capacity = E.placementCapacity(g.state, g.mp, g.rules, p);
    return Object.assign(r, { cardArmies: cardArmies || 0, pool, capacity, placeable: Math.min(pool, capacity) });
  }

  // ------------------------------------------------------------------ I-Com (manual p50-51)
  const LEVEL_TEXT = { 1: "Level 1 - spare each other's continents and largest empire", 2: "Level 2 - no attacks on each other (one card attack allowed)", 3: "Level 3 - no attacks of any kind" };
  function icomAvailable(g) { return humans(g).length === 1 && alive(g).length > 2; }
  function aiConsider(g, ai, from, level) {
    const pers = seat(g, ai).personality, att = g.attitude[ai][from] || 0;
    const strongFrom = E.totalArmies(g.state, from) / Math.max(1, E.totalArmies(g.state, ai));
    let p = 0.35 + 0.35 * pers.honor + 0.15 * att - 0.1 * (level - 1) + (strongFrom > 1.3 ? 0.2 : 0) - (g.grudges[ai][from] || 0) * 0.3;
    p = Math.max(0.03, Math.min(0.95, p));
    return rnd(g.aiRng) < p;
  }
  function propose(g, from, to, level) {
    if (level === "threat") {
      if (seat(g, to).type === "ai") { g.attitude[to][from] = (g.attitude[to][from] || 0) - 0.5; g.grudges[to][from] = (g.grudges[to][from] || 0) + 0.3 * seat(g, to).personality.memory; }
      log(g, `${seat(g, from).name} sends a threat to ${seat(g, to).name}`, "icom");
      return "sent";
    }
    const ok = seat(g, to).type === "ai" ? aiConsider(g, to, from, level) : true;
    if (ok) {
      g.agreements = g.agreements.filter(a => !(a.round === g.state.round && ((a.a === from && a.b === to) || (a.a === to && a.b === from))));
      g.agreements.push({ a: from, b: to, level, round: g.state.round });
    }
    log(g, `${LEVEL_TEXT[level].split(" - ")[0]} alliance, ${seat(g, from).name} → ${seat(g, to).name}: ${ok ? "accepted" : "declined"}`, "icom");
    return ok ? "accepted" : "declined";
  }
  function agreementBetween(g, a, b) {
    return g.agreements.find(x => x.round === g.state.round && ((x.a === a && x.b === b) || (x.a === b && x.b === a)));
  }
  function largestGroupSet(g, p) {
    const owned = new Set(E.ownedBy(g.state, p)), seen = new Set(); let best = [];
    for (const s of [...owned].sort()) { if (seen.has(s)) continue; const grp = [], q = [s]; seen.add(s);
      while (q.length) { const t = q.shift(); grp.push(t); for (const n of g.mp.t[t].adj) if (owned.has(n) && !seen.has(n)) { seen.add(n); q.push(n); } }
      if (grp.length > best.length) best = grp; }
    return new Set(best);
  }
  /** Is an attack by `p` on territory `t` forbidden by an agreement this round? */
  function forbidden(g, p, t, attacksSoFar) {
    const owner = g.state.territories[t].owner; if (!owner) return false;
    const ag = agreementBetween(g, p, owner); if (!ag) return false;
    if (ag.level === 3) return true;
    if (ag.level === 2) return attacksSoFar.filter(x => g.state.territories[x].owner === owner).length >= 1;
    const c = g.mp.t[t].continent;
    const ownsCont = g.mp.members(c).every(x => g.state.territories[x].owner === owner);
    return ownsCont || largestGroupSet(g, owner).has(t);
  }
  /** After orders are known: AIs note broken agreements (manual p51 step 1). */
  function checkAgreements(g, orders) {
    for (const [p, os] of Object.entries(orders)) {
      const seen = [];
      for (const o of os) {
        const owner = g.state.territories[o.target].owner;
        if (forbidden(g, p, o.target, seen) && seat(g, owner).type === "ai") {
          g.attitude[owner][p] = (g.attitude[owner][p] || 0) - 1;
          g.grudges[owner][p] = (g.grudges[owner][p] || 0) + seat(g, owner).personality.memory;
          log(g, `${seat(g, owner).name} notes that ${seat(g, p).name} broke their alliance!`, "icom");
        }
        seen.push(o.target);
      }
    }
  }

  // ------------------------------------------------------------------ AI
  function threat(g, p, t) {
    let s = 0; for (const n of g.mp.t[t].adj) { const o = g.state.territories[n]; if (o.owner && o.owner !== p) s += Math.max(0, o.armies - 1); } return s;
  }
  const isFrontier = (g, p, t) => [...g.mp.t[t].adj].some(n => g.state.territories[n].owner !== p);

  function aiTradeCards(g, p) {
    let armies = 0;
    for (;;) {
      const hand = g.cards.hands[p], sets = findSets(hand);
      if (!sets.length) break;
      const pers = seat(g, p).personality;
      if (hand.length < 5 && g.rules.value("card_trade_mode") === "ascending" && rnd(g.aiRng) < pers.caution * 0.5) break;
      armies += tradeSet(g, p, sets[0]).armies;
    }
    return armies;
  }

  function aiPlacements(g, p, amount, pool) {
    const s = g.state, placed = {}, restricted = g.rules.value("placement_restriction") === "one_plus_owned_neighbours";
    const pers = seat(g, p).personality;
    const owned = E.ownedBy(s, p);
    const contScore = {};
    for (const c of Object.keys(g.mp.continents)) {
      const m = g.mp.members(c), mine = m.filter(t => s.territories[t].owner === p).length;
      contScore[c] = mine / m.length;
    }
    for (let k = 0; k < amount; k++) {
      let best = null, bs = -1e9;
      for (const t of owned) {
        const cap = restricted ? E.placementCap(s, g.mp, p, t) : Infinity;
        if ((placed[t] || 0) >= cap) continue;
        const front = isFrontier(g, p, t);
        const cur = s.territories[t].armies + (placed[t] || 0);
        let sc = front ? 10 : -10;
        sc += pers.caution * (threat(g, p, t) - cur) * 0.6;
        sc += (1 - pers.caution) * [...g.mp.t[t].adj].filter(n => s.territories[n].owner !== p).reduce((a, n) => a + Math.max(0, 8 - s.territories[n].armies), 0) * 0.4;
        sc += contScore[g.mp.t[t].continent] * 6;
        if (g.capitals[p] === t) sc += 6;
        sc += rnd(g.aiRng) * (2 + 8 * pers.erratic);
        if (sc > bs) { bs = sc; best = t; }
      }
      if (!best) break;
      placed[best] = (placed[best] || 0) + 1;
    }
    return placed;
  }

  function aiAttacks(g, p) {
    const s = g.state, pers = seat(g, p).personality, diff = seat(g, p).difficulty;
    const minG = g.rules.value("min_garrison");
    const avail = {};
    for (const t of E.ownedBy(s, p)) {
      const th = threat(g, p, t), a = s.territories[t].armies - minG;
      const reserve = Math.round(pers.caution * Math.min(a, th * 0.5)) + (g.capitals[p] === t ? Math.round(a * 0.5) : 0);
      avail[t] = Math.max(0, a - reserve);
    }
    const targets = new Set();
    for (const t of E.ownedBy(s, p)) for (const n of g.mp.t[t].adj) if (s.territories[n].owner !== p) targets.add(n);
    const scored = [];
    const threshold = 0.82 - 0.4 * pers.aggression + (diff === "easy" ? 0.1 : 0);
    for (const t of targets) {
      const owner = s.territories[t].owner, d = s.territories[t].armies;
      const c = g.mp.t[t].continent, m = g.mp.members(c);
      const mine = m.filter(x => s.territories[x].owner === p).length;
      let value = 1 + (mine / m.length) * 3;
      if (owner && m.every(x => x === t || s.territories[x].owner === owner)) value += 2.5; // break a continent
      if (g.capitals[owner] === t && g.objective === "capital") value += 6;
      if (owner) value += Math.max(0, -(g.attitude[p][owner] || 0)) * 0.8 + (g.grudges[p][owner] || 0) * 0.8;
      value += rnd(g.aiRng) * pers.erratic * 3;
      scored.push({ t, d, value, owner });
    }
    scored.sort((a, b) => b.value / (b.d + 2) - a.value / (a.d + 2));
    const orders = [], attacked = [];
    for (const { t, d, value } of scored) {
      if (forbidden(g, p, t, attacked) && rnd(g.aiRng) < pers.honor) continue;
      const srcs = [...g.mp.t[t].adj].filter(n => s.territories[n].owner === p && avail[n] > 0).sort((a, b) => avail[b] - avail[a]);
      if (!srcs.length) continue;
      const want = Math.min(0.97, threshold + (value > 4 ? -0.05 : 0.05));
      const use = {};
      let p0 = 0;
      for (const src of srcs) {
        use[src] = avail[src];
        p0 = massOdds(g.rules, Object.values(use), d);
        if (p0 >= want + 0.08) break;
      }
      if (p0 < threshold) continue;
      // trim: don't over-commit when odds are overwhelming
      for (const src of Object.keys(use)) {
        while (use[src] > 1 && massOdds(g.rules, Object.values(use).map((v, i) => Object.keys(use)[i] === src ? v - 1 : v), d) >= want + 0.1 * pers.caution) use[src]--;
      }
      for (const [src, n] of Object.entries(use)) { orders.push({ source: src, target: t, armies: n, surge_to: null, surge_armies: null }); avail[src] -= n; }
      attacked.push(t);
    }
    // Card insurance (manual p55): make sure at least one likely capture
    if (!orders.length) {
      let best = null;
      for (const t of targets) for (const src of [...g.mp.t[t].adj].filter(n => s.territories[n].owner === p && avail[n] > 0)) {
        const q = odds(g.rules, avail[src], s.territories[t].armies);
        if (q > 0.55 && (!best || q > best.q)) best = { src, t, q };
      }
      if (best) orders.push({ source: best.src, target: best.t, armies: avail[best.src], surge_to: null, surge_armies: null });

    // Surge: strongest single attack, onward into a weak neighbour
    if (orders.length && rnd(g.aiRng) < 0.3 + 0.7 * pers.surge) {
      let best = null;
      for (const o of orders) {
        const d = s.territories[o.target].armies;
        const left = o.armies - d * 0.8;
        if (left < 3) continue;
        for (const n of g.mp.t[o.target].adj) {
          if (n === o.source || s.territories[n].owner === p) continue;
          const sc = left / (s.territories[n].armies + 1);
          if (sc > 2 && (!best || sc > best.sc)) best = { o, n, sc };
        }
      }
      if (best) best.o.surge_to = best.n;
    }
    return orders;
  }

  function aiTactical(g, p) {
    const s = g.state, minG = g.rules.value("min_garrison");
    const capped = g.rules.value("tactical_destination_cap") === "placement_cap";
    const cap = t => capped ? E.placementCap(s, g.mp, p, t) : Infinity;
    const owned = E.ownedBy(s, p);
    const dist = {}, q = [];
    for (const t of owned) if (isFrontier(g, p, t)) { dist[t] = 0; q.push(t); }
    while (q.length) { const t = q.shift(); for (const n of g.mp.t[t].adj) if (s.territories[n].owner === p && !(n in dist)) { dist[n] = dist[t] + 1; q.push(n); } }
    const plan = (src, order) => {
      let left = s.territories[src].armies - minG; const dests = [];
      for (const d of order) { if (left <= 0) break; const n = Math.min(left, cap(d)); if (n > 0) { dests.push([d, n]); left -= n; } }
      return dests;
    };
    let best = null;
    for (const t of owned) {
      const a = s.territories[t].armies - minG; if (a <= 0) continue;
      const nbs = [...g.mp.t[t].adj].filter(n => s.territories[n].owner === p);
      if (!nbs.length) continue;
      let order;
      if (dist[t] > 0) order = nbs.filter(n => dist[n] < dist[t]).sort((x, y) => dist[x] - dist[y]);
      else if (threat(g, p, t) === 0) order = nbs.filter(n => threat(g, p, n) > 0).sort((x, y) => threat(g, p, y) - threat(g, p, x));
      else continue;
      const dests = plan(t, order), moved = dests.reduce((n, d) => n + d[1], 0);
      if (moved && (!best || moved > best.moved)) best = { source: t, destinations: dests, moved };
    }
    return best ? { source: best.source, destinations: best.destinations } : null;
  }

  // ------------------------------------------------------------------ round flow
  /** AI decides deployment (start of game). */
  function aiDeploy(g, p) {
    const n = g.startPool[p];
    const placed = {}, owned = E.ownedBy(g.state, p);
    for (let k = 0; k < n; k++) {
      let best = null, bs = -1e9;
      for (const t of owned) {
        const sc = (isFrontier(g, p, t) ? 5 : -5) + threat(g, p, t) * 0.3 - ((placed[t] || 0) + 1) * 0.8 + rnd(g.aiRng) * 3
          + (g.capitals[p] === t ? 4 : 0);
        if (sc > bs) { bs = sc; best = t; }
      }
      placed[best] = (placed[best] || 0) + 1;
    }
    return placed;
  }
  function applyDeploy(g, all) {
    for (const [p, pl] of Object.entries(all)) {
      let sum = 0;
      for (const [t, n] of Object.entries(pl)) { if (g.state.territories[t].owner !== p || n < 0) throw new Error("bad deploy"); sum += n; }
      if (sum !== g.startPool[p]) throw new Error(`deploy ${sum} != ${g.startPool[p]}`);
    }
    for (const [p, pl] of Object.entries(all)) for (const [t, n] of Object.entries(pl)) g.state.territories[t].armies += n;
    g.phase = "diplomacy";
    log(g, "All armies deployed. The war begins.", "phase");
  }

  /** Reinforcement for AIs (humans supply theirs). Returns placements map. */
  function aiReinforce(g, p) {
    const cardArmies = aiTradeCards(g, p);
    const info = reinforcementInfo(g, p, cardArmies);
    return aiPlacements(g, p, info.placeable, info.pool);
  }
  function applyReinforcement(g, all, infos) {
    for (const [p, pl] of Object.entries(all)) {
      const errs = E.validatePlacements(g.state, g.mp, g.rules, p, pl, infos[p].placeable);
      if (errs.length) throw new Error(errs.join("; "));
    }
    g.state = E.applyPlacements(g.state, all);
    for (const p of Object.keys(infos)) if (infos[p].pool > infos[p].placeable)
      log(g, `${seat(g, p).name} forfeits ${infos[p].pool - infos[p].placeable} armies (placement limits)`, "warn");
  }

  /** Resolve battles; awards cards; returns report. */
  function resolveBattles(g, orders) {
    checkAgreements(g, orders);
    const before = E.copyState(g.state);
    const res = E.resolveBattlePhase(g.state, g.mp, g.rules, orders, new E.PCG32(g.seed, g.state.round));
    g.state = res.state; g.lastReport = res.report; g.lastBefore = before; g.lastOrders = orders;
    // one card per player that conquered at least one territory (manual p34)
    const cardRng = new E.PCG32(g.seed, 100000 + g.state.round);
    for (const p of g.state.players) {
      const conquered = Object.keys(g.state.territories).some(t => g.state.territories[t].owner === p && before.territories[t].owner !== p);
      if (conquered) drawCard(g, p, cardRng);
    }
    for (const p of res.report.eliminated) {
      log(g, `${seat(g, p).name} has been eliminated!`, "elim");
      g.cards.discard.push(...g.cards.hands[p]); g.cards.hands[p] = []; // UNSOURCED: cards of eliminated players
    }
    return res.report;
  }
  function applyTactical(g, moves) {
    for (const [p, m] of Object.entries(moves)) { const e = E.validateTactical(g.state, g.mp, g.rules, p, m); if (e.length) throw new Error(e.join("; ")); }
    g.state = E.applyTactical(g.state, moves);
  }
  function checkVictory(g) {
    const a = alive(g);
    if (a.length === 1) return a[0];
    if (g.objective === "capital") {
      const need = capitalTarget(g);
      for (const p of a) {
        if (!g.capitals[p] || g.state.territories[g.capitals[p]].owner !== p) continue;
        const held = Object.entries(g.capitals).filter(([q, t]) => q !== p && g.state.territories[t].owner === p).length;
        if (held >= need) return p;
      }
      return null;
    }
    const need = E.dominationTarget(g.rules, g.mp.ids.length, g.rules.value("domination_percent"));
    for (const p of a) if (E.ownedBy(g.state, p).length >= need) return p;
    return null;
  }
  function endRound(g) {
    g.winner = checkVictory(g);
    g.state.round++;
    snapshot(g);
    if (g.winner) { g.phase = "over"; log(g, `${seat(g, g.winner).name} wins the war!`, "win"); }
    else g.phase = "diplomacy";
  }

  /** Run one full round where every player is an AI (used by tests / spectating). */
  function autoRound(g) {
    const ps = alive(g), infos = {}, pl = {};
    for (const p of ps) { const ca = aiTradeCards(g, p); infos[p] = reinforcementInfo(g, p, ca); pl[p] = aiPlacements(g, p, infos[p].placeable, infos[p].pool); }
    applyReinforcement(g, pl, infos);
    const orders = {}; for (const p of ps) orders[p] = aiAttacks(g, p);
    resolveBattles(g, orders);
    const moves = {}; for (const p of alive(g)) moves[p] = aiTactical(g, p);
    applyTactical(g, moves);
    endRound(g);
  }

  // ------------------------------------------------------------------ save / load

    const attackers = b.participants.filter(x => x.role === "attack");
    if (b.kind === "border_clash") {
      const [A, B] = b.territory.split("<->"), [ax, ay] = POS[A], [bx, by] = POS[B];
      let mx = (ax + bx) / 2, my = (ay + by) / 2, ux = bx - ax, uy = by - ay;
      if (Math.abs(ux) > W / 2) { mx = ax < bx ? 6 : W - 6; my = (ay + by) / 2; ux = ax < bx ? -1 : 1; uy = 0; }
      const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
      for (const pt of b.participants) { const sgn = pt.origin === A ? -1 : 1; pos[pt.key] = [mx + sgn * ux * 11, my + sgn * uy * 11]; }
      return pos;
    }
    const [tx, ty] = POS[tgt];
    if (b.kind === "spoils_of_war") {
      attackers.forEach((pt, i) => { const a = (i / attackers.length) * Math.PI * 2 - Math.PI / 2; pos[pt.key] = [tx + Math.cos(a) * 24, ty + Math.sin(a) * 24]; });

    attackers.forEach((pt, i) => {
      const [sx, sy] = POS[pt.origin]; let ux = sx - tx, uy = sy - ty;
      if (Math.abs(ux) > W / 2) { ux = sx < tx ? 1 : -1; uy = 0; }
      const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
      const k = attackers.slice(0, i).filter(q => q.origin === pt.origin).length;
      pos[pt.key] = [tx + ux * (25 + k * 15), ty + uy * (25 + k * 15)];

        ? "You are on a server running on YOUR computer, so you can't see a host on another computer. Close this, then open the address shown in the host's server window (e.g. http://192.168.1.23:8765/) — or double-click “Join network game.bat” and type it."

  /** Joining players fill open human seats, then closed slots (up to 8), then replace computer players (last first). */
  function lobbySeats() {
    const mp = ui.mp;
    const all = mp.room.peers().filter(p => p.presence && p.presence.n)
      .sort((a, b) => (b.presence.h ? 1 : 0) - (a.presence.h ? 1 : 0) || (a.presence.jt || 0) - (b.presence.jt || 0) || (a.peer < b.peer ? -1 : 1));
    const humans = all.slice(0, 8), watchers = all.slice(8);
    const keep = Math.max(0, Math.min(mp.tmpl.ais.length, 8 - humans.length));
    const ais = mp.tmpl.ais.slice(0, keep), dropped = mp.tmpl.ais.slice(keep);

  }
  function mpStart() {
    const mp = ui.mp;
    const L = lobbySeats(), humansP = L.humans;
    const seats = humansP.map(p => ({ type: "human", name: String(p.presence.n).slice(0, 20) })).concat(L.ais);
    const cfg = { seed: Math.floor(Math.random() * 1e9), seats, objective: mp.tmpl.objective, dominationPercent: mp.tmpl.dominationPercent, restricted: mp.tmpl.restricted, map: mp.tmpl.map, online: true };
    mp.room.presence({ st: { cfg, peers: humansP.map(p => p.peer) } });
    mpCheck();
  }
  function mpBeginGame(st) {
    const mp = ui.mp;
    st.peers.forEach((peer, i) => { mp.seatPeer["p" + (i + 1)] = peer; });
    const myPeer = mp.room.myPeer();
    const idx = st.peers.indexOf(myPeer);
    mp.mySeat = idx >= 0 ? "p" + (idx + 1) : null;
    mp.started = true;
    g = G.newGame(st.cfg, RULES_DB, window.SAMETIME_MAPS[st.cfg.map]);
    G.log(g, `Online game ${mp.code} started. ${mp.mySeat ? "You are " + G.seat(g, mp.mySeat).name + "." : "You are watching."}`, "phase");
    gameScreen(); beginSetupPhases();
  }

  function mpBegin(kind) {
    const mp = ui.mp;
    g.phase = PHASE_NAME[kind]; ui.collected = {}; ui.infos = {}; ui.mpTrades = []; ui.cardSel = [];
    const key = (kind === "cap" || kind === "dep" ? 0 : g.state.round) + "." + kind;
    mp.phase = { kind, key }; mp.snap = G.serialize(g); mp.mine = null; mp.revealed = null;
    const me = mp.mySeat;
    if (me && G.alive(g).includes(me) && G.seat(g, me).type === "human") {
      ui.queue = [me];
      const fn = { cap: p => panelCapital(p), dep: p => panelPlace(p, g.startPool[p], false), rf: p => { ui.cardArmies = 0; panelReinforce(p); },
        ord: p => { ui.orders = []; ui.surge = null; ui.surgePick = false; panelOrders(p); }, tac: p => { ui.tactical = null; panelTactical(p); } }[kind];
      nextHuman(fn, () => {});
    } else { ui.current = null; panelWaiting(); }
    render(); mpCheck();
  }
  function mpSubmit(kind) {
    const mp = ui.mp, me = mp.mySeat, c = ui.collected[me];
    const d = { cap: () => ({ t: g.capitals[me] }), dep: () => ({ pl: c || {} }), rf: () => ({ tr: ui.mpTrades, pl: c || {} }),
      ord: () => ({ o: (c || []).map(o => [o.source, o.target, o.armies, o.surge_to || 0, o.surge_armies || 0]) }), tac: () => ({ m: c || null }) }[kind]();
    const text = JSON.stringify(d), salt = randHex(12);
    mp.mine = { key: mp.phase.key, d: text, s: salt, x: seal(salt, text) };
    ui.current = null; ui.selected = null;
    mp.room.presence({ sub: { k: mp.mine.key, x: mp.mine.x } });
    panelWaiting(); render(); mpCheck();
  }
  const humanSeats = () => G.alive(g).filter(p => G.seat(g, p).type === "human");

  function mpCheck() {
    const mp = ui.mp; if (!mp) return;
    const peers = mp.room.peers(), byPeer = {};
    for (const p of peers) byPeer[p.peer] = p.presence || {};
    mp.byPeer = byPeer;
    const hostP = peers.find(p => p.presence && p.presence.h);
    if (!mp.started) {
      if (hostP && hostP.presence.st) {
        if (hostP.presence.st.peers.includes(mp.room.myPeer())) return mpBeginGame(hostP.presence.st);
        if (!mp.lateNote) { mp.lateNote = true; const el = $("#lobbylist"); if (el) el.prepend(h("p", { class: "warn" }, "This game has already started without you.")); }
        return;
      }
      if (hostP && hostP.presence.acc && !mp.lateNote) { mp.lateNote = true; const el = $("#lobbylist"); if (el) el.prepend(h("p", { class: "warn" }, "This game is already in progress.")); }
      return mpRenderLobby();

    if (!ph) return;
    const key = ph.key, tk = new Set(mp.takeovers);

      const subOf = s => s === mp.mySeat ? (mp.mine && mp.mine.key === key ? mp.mine.x : null) : ((byPeer[mp.seatPeer[s]] || {}).sub || {}).k === key ? byPeer[mp.seatPeer[s]].sub.x : null;
      if (req.every(s => tk.has(s) || subOf(s))) {
        const x = {}; for (const s of req) x[s] = tk.has(s) ? "ai" : subOf(s);
        const cur = mp.acc;
        if (!cur || cur.k !== key || JSON.stringify(cur.x) !== JSON.stringify(x)) {
          mp.acc = { k: key, v: cur && cur.k === key ? cur.v + 1 : 1, x };
          mp.room.presence({ acc: mp.acc, st: null }); // everyone has started by now; free presence space
        }
      }
    }
    const acc = mp.host ? mp.acc : (hostP ? hostP.presence.acc : null);
    if (!acc || acc.k !== key) return updateWaiting(hostP);
    if (mp.mine && mp.mine.key === key && acc.x[mp.mySeat] === mp.mine.x && mp.revealed !== key) {
      mp.revealed = key; mp.room.presence({ rev: { k: key, d: mp.mine.d, s: mp.mine.s } });
    }
    const inputs = {};
    for (const [s, x] of Object.entries(acc.x)) {
      if (x === "ai") { inputs[s] = "ai"; continue; }
      const r = s === mp.mySeat && mp.mine && mp.mine.key === key ? { k: key, d: mp.mine.d, s: mp.mine.s } : (byPeer[mp.seatPeer[s]] || {}).rev;
      if (!r || r.k !== key) return updateWaiting(hostP);
      inputs[s] = seal(r.s, r.d) === x ? r.d : null;
    }
    if (mp.applied.has(key)) return;
    mp.applied.add(key);
    mpApply(ph.kind, key, inputs);
  }

  function takeOver(s) {
    const i = g.seats.findIndex(x => x.id === s); if (i < 0 || g.seats[i].type === "ai") return;
    const pers = G.PERSONALITIES[i % G.PERSONALITIES.length];
    g.cfg.seats[i] = Object.assign({}, g.cfg.seats[i], { type: "ai", personality: i % G.PERSONALITIES.length, name: g.cfg.seats[i].name });
    g.seats[i].type = "ai"; g.seats[i].personality = pers;
    g.attitude[s] = {}; g.grudges[s] = {}; for (const o of g.state.players) if (o !== s) g.attitude[s][o] = 0;
    G.log(g, `A computer general takes over ${g.seats[i].name}'s armies.`, "warn");
  }
  function parseInput(v) { try { return typeof v === "string" ? JSON.parse(v) : null; } catch (e) { return null; } }

  function mpApply(kind, key, raw) {
    const mp = ui.mp;
    mp.phase = null;
    g = G.deserialize(mp.snap, RULES_DB, window.SAMETIME_MAPS);
    for (const [s, v] of Object.entries(raw)) if (v === "ai") takeOver(s);
    const inp = {}; for (const [s, v] of Object.entries(raw)) if (v !== "ai") inp[s] = parseInput(v);
    const isHuman = p => G.seat(g, p).type === "human" && inp[p];
